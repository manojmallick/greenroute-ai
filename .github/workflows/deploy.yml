name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west4
  GAR_REGISTRY: europe-west4-docker.pkg.dev

jobs:
  # ── Test first ──────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test --workspaces --if-present

  # ── Deploy all services ─────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_REGISTRY }} --quiet

      - name: Build & push API Gateway
        run: |
          docker build -t $GAR_REGISTRY/$PROJECT_ID/greenroute/api-gateway:${{ github.sha }} \
            -f packages/api-gateway/Dockerfile .
          docker push $GAR_REGISTRY/$PROJECT_ID/greenroute/api-gateway:${{ github.sha }}

      - name: Build & push Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          docker build -t $GAR_REGISTRY/$PROJECT_ID/greenroute/frontend:${{ github.sha }} \
            --build-arg VITE_API_URL=$VITE_API_URL \
            -f packages/frontend/Dockerfile .
          docker push $GAR_REGISTRY/$PROJECT_ID/greenroute/frontend:${{ github.sha }}

      - name: Build & push Agent images
        run: |
          for svc in router-agent monitor-agent replanner-agent; do
            docker build -t $GAR_REGISTRY/$PROJECT_ID/greenroute/${svc}:${{ github.sha }} \
              -f packages/${svc}/Dockerfile . &
          done
          wait
          for svc in router-agent monitor-agent replanner-agent; do
            docker push $GAR_REGISTRY/$PROJECT_ID/greenroute/${svc}:${{ github.sha }} &
          done
          wait

      - name: Deploy API Gateway
        run: |
          gcloud run deploy greenroute-api-gateway \
            --image=$GAR_REGISTRY/$PROJECT_ID/greenroute/api-gateway:${{ github.sha }} \
            --region=$REGION --platform=managed \
            --allow-unauthenticated --port=3000 \
            --memory=512Mi --min-instances=1 \
            --network=default \
            --set-env-vars="NODE_ENV=production,REDIS_URL=${{ secrets.REDIS_URL }}"

      - name: Deploy Frontend
        run: |
          gcloud run deploy greenroute-frontend \
            --image=$GAR_REGISTRY/$PROJECT_ID/greenroute/frontend:${{ github.sha }} \
            --region=$REGION --platform=managed \
            --allow-unauthenticated --port=80 --memory=256Mi

      - name: Deploy Agents
        run: |
          gcloud run deploy greenroute-router-agent \
            --image=$GAR_REGISTRY/$PROJECT_ID/greenroute/router-agent:${{ github.sha }} \
            --region=$REGION --platform=managed \
            --no-allow-unauthenticated --port=3001 --memory=1Gi \
            --network=default \
            --set-env-vars="NODE_ENV=production,REDIS_URL=${{ secrets.REDIS_URL }}" &

          gcloud run deploy greenroute-monitor-agent \
            --image=$GAR_REGISTRY/$PROJECT_ID/greenroute/monitor-agent:${{ github.sha }} \
            --region=$REGION --platform=managed \
            --no-allow-unauthenticated --port=3002 --memory=512Mi \
            --network=default \
            --set-env-vars="NODE_ENV=production,REDIS_URL=${{ secrets.REDIS_URL }},GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" &

          gcloud run deploy greenroute-replanner-agent \
            --image=$GAR_REGISTRY/$PROJECT_ID/greenroute/replanner-agent:${{ github.sha }} \
            --region=$REGION --platform=managed \
            --no-allow-unauthenticated --port=3003 --memory=512Mi \
            --network=default \
            --set-env-vars="NODE_ENV=production,REDIS_URL=${{ secrets.REDIS_URL }},GOOGLE_GEMINI_API_KEY=${{ secrets.GOOGLE_GEMINI_API_KEY }}" &
          wait

      - name: ✅ Print Live URLs
        run: |
          echo "Frontend:"
          gcloud run services describe greenroute-frontend --region=$REGION --format='value(status.url)'
          echo "API Gateway:"
          gcloud run services describe greenroute-api-gateway --region=$REGION --format='value(status.url)'
