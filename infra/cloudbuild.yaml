steps:
  # ── Build all service images ──────────────────────────────────────────────

  - id: build-api-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/api-gateway:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/api-gateway:latest
      - -f
      - packages/api-gateway/Dockerfile
      - .
    waitFor: ['-']

  - id: build-router-agent
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/router-agent:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/router-agent:latest
      - -f
      - packages/router-agent/Dockerfile
      - .
    waitFor: ['-']

  - id: build-monitor-agent
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/monitor-agent:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/monitor-agent:latest
      - -f
      - packages/monitor-agent/Dockerfile
      - .
    waitFor: ['-']

  - id: build-replanner-agent
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/replanner-agent:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/replanner-agent:latest
      - -f
      - packages/replanner-agent/Dockerfile
      - .
    waitFor: ['-']

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/frontend:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/frontend:latest
      - -f
      - packages/frontend/Dockerfile
      - --build-arg
      - VITE_API_URL=https://api-gateway-${_CLOUD_RUN_SUFFIX}
      - .
    waitFor: ['-']

  # ── Push all images in parallel ───────────────────────────────────────────

  - id: push-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/api-gateway:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/router-agent:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/monitor-agent:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/replanner-agent:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/frontend:${SHORT_SHA} &
        wait
    waitFor:
      - build-api-gateway
      - build-router-agent
      - build-monitor-agent
      - build-replanner-agent
      - build-frontend

  # ── Deploy to Cloud Run ───────────────────────────────────────────────────

  - id: deploy-api-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - greenroute-api-gateway
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/api-gateway:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --set-env-vars=NODE_ENV=production,REDIS_URL=${_REDIS_URL}
    waitFor: [push-images]

  - id: deploy-router-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - greenroute-router-agent
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/router-agent:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=3001
      - --memory=1Gi
      - --cpu=1
      - --set-env-vars=NODE_ENV=production,REDIS_URL=${_REDIS_URL}
    waitFor: [push-images]

  - id: deploy-monitor-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - greenroute-monitor-agent
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/monitor-agent:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=3002
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=NODE_ENV=production,REDIS_URL=${_REDIS_URL},GOOGLE_MAPS_API_KEY=${_MAPS_KEY}
    waitFor: [push-images]

  - id: deploy-replanner-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - greenroute-replanner-agent
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/replanner-agent:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=3003
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=NODE_ENV=production,REDIS_URL=${_REDIS_URL},GOOGLE_GEMINI_API_KEY=${_GEMINI_KEY}
    waitFor: [push-images]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - greenroute-frontend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/frontend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=80
      - --memory=256Mi
      - --cpu=1
    waitFor: [push-images]

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/api-gateway:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/router-agent:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/monitor-agent:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/replanner-agent:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/greenroute/frontend:${SHORT_SHA}

substitutions:
  _REGION: europe-west4
  _REDIS_URL: redis://10.0.0.1:6379  # Override with actual Memorystore IP
  _MAPS_KEY: ""
  _GEMINI_KEY: ""
  _CLOUD_RUN_SUFFIX: "xxx-ew.a.run.app"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
